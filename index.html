<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b24" />
    <title>Trailer Park Tamers</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <button id="musicbtn" type="button" title="Music on/off" aria-label="Mute music"><svg viewBox="0 0 12 12" width="18" height="18" aria-hidden="true"><path class="note" d="M4 1h7v2H6v6H5v1H4v1H1v-1H0V8h1V7h3V1zM9 3h2v5h-1v1H9v1H6V9h1V7h2V3z"/><line class="slash" x1="0.5" y1="11.5" x2="11.5" y2="0.5"/></svg></button>
      <button id="hud" type="button" hidden title="Who's online"><span id="netdot"></span><span id="nettext"></span></button>
      <div id="who" hidden role="dialog" aria-label="Players online">
        <div class="whohead"><span>WHO'S ONLINE</span><button type="button" id="whoclose" aria-label="Close">X</button></div>
        <ul id="wholist"></ul>
      </div>
      <div id="chatlog" aria-live="polite"></div>
      <form id="chatbar" autocomplete="off" hidden>
        <input id="chatin" maxlength="90" placeholder="Say something..." enterkeyhint="send" />
      </form>
      <div id="pad" aria-hidden="true">
        <div class="dpad">
          <button data-key="up" class="d up"></button>
          <button data-key="left" class="d left"></button>
          <button data-key="right" class="d right"></button>
          <button data-key="down" class="d down"></button>
          <span class="d hub"></span>
        </div>
        <div class="mid">
          <button data-act="chat" class="pill">CHAT</button>
          <button data-key="start" class="pill">START</button>
        </div>
        <div class="ab">
          <button data-key="b" class="round b">B</button>
          <button data-key="a" class="round a">A</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
